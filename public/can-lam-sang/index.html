<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#102a24;background:#f5f7f6}
*{box-sizing:border-box}body{margin:0}.page{max-width:900px;margin:auto;padding:20px 14px 40px}.panel{background:#fff;border:1px solid #d7e0dc;border-radius:18px;padding:18px;box-shadow:0 4px 18px #102a2410}
.cls-header{margin-bottom:18px}.cls-header h1{font-size:28px;margin:4px 0}.cls-header p,.cls-muted{color:#60736c;font-size:14px;line-height:1.55}.cls-link{border:0;background:none;padding:0;cursor:pointer;color:#145c4c;font:inherit;font-weight:700}.cls-entry-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.cls-entry{min-height:150px;text-align:left;display:grid;align-content:center;gap:8px;padding:20px;border:1px solid #b9c9c3;border-radius:15px;background:#f7faf9;cursor:pointer;font:inherit}.cls-entry:hover,.cls-entry:focus-visible{border-color:#145c4c;outline:2px solid #145c4c55}.cls-entry strong{font-size:20px;color:#145c4c}.cls-entry span{color:#60736c;line-height:1.5}.cls-notice{padding:14px;border-radius:12px;background:#eef5f2}.cls-error{background:#fff0ef;color:#8a2922}.cls-review-label{display:inline-block;max-width:100%;margin:0;padding:7px 10px;line-height:1.35;white-space:normal;overflow-wrap:anywhere;border-radius:999px;background:#fff2cf;color:#704b00;border:1px solid #d9b75e;font-size:12px;font-weight:800}.cls-submitted{display:inline-block;padding:5px 8px;border-radius:999px;background:#e5f3ea;color:#286344;font-size:11px;font-weight:700}.cls-search{display:grid;gap:5px;margin-bottom:14px}.cls-search input{min-height:44px;border:1px solid #b9c9c3;border-radius:11px;padding:8px 12px;font:inherit;width:100%}.cls-case-list{display:grid;gap:9px}.cls-case-card{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:10px;width:100%;text-align:left;padding:14px;min-width:0;border:1px solid #d7e0dc;border-radius:13px;background:#fff;cursor:pointer;font:inherit}.cls-case-card:hover,.cls-case-card:focus-visible{border-color:#145c4c;outline:2px solid #145c4c33}.cls-case-card>div:first-child{min-width:0;width:100%}.cls-case-meta{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:6px;min-width:0;max-width:100%}.cls-card{margin:12px 0;padding:16px;border:1px solid #d7e0dc;border-radius:15px;background:#fff}.cls-card h2,.cls-card h3,.cls-result h2,.cls-result h3{color:#145c4c}.cls-dl{display:grid;grid-template-columns:140px 1fr;gap:7px;font-size:14px}.cls-dl dt{font-weight:700;color:#60736c}.cls-dl dd{margin:0}.cls-fieldset{border:0;border-top:1px solid #d7e0dc;padding:14px 0 0;margin:14px 0 0}.cls-fieldset legend{font-weight:800;color:#145c4c}.cls-choice-grid{display:grid;gap:8px}.cls-choice{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #d7e0dc;border-radius:10px;cursor:pointer;line-height:1.45}.cls-choice input{width:20px;height:20px;flex:none}.cls-submit{width:100%;min-height:48px;margin:4px 0 12px;border:1px solid #145c4c;border-radius:11px;background:#145c4c;color:#fff;font:inherit;font-weight:800;cursor:pointer}.cls-result{padding:16px;border-radius:15px;background:#edf7f1}.cls-result li,.cls-result p{line-height:1.6}.cls-error{margin-top:8px}@media(max-width:560px){.page{padding:12px 9px 28px}.cls-entry-grid{grid-template-columns:1fr}.cls-case-meta{justify-content:flex-start}.cls-dl{grid-template-columns:1fr;gap:2px}.cls-dl dd{margin-bottom:8px}.cls-card{padding:13px}.cls-header h1{font-size:24px}}
.notice{padding:14px;border-radius:12px;background:#eef5f2}.error{background:#fff0ef;color:#8a2922}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}select,button{font:inherit;min-height:44px;border-radius:11px;border:1px solid #b9c9c3;padding:8px 12px;background:#fff}button.primary{background:#145c4c;color:#fff;border-color:#145c4c;font-weight:700}button.choice{flex:1;min-width:80px}button.choice[aria-pressed=true]{background:#145c4c;color:#fff;border-color:#145c4c}table{width:100%;border-collapse:separate;border-spacing:0 8px}th{text-align:left;font-size:12px;color:#60736c;padding:0 8px}td{padding:10px 8px;background:#f7faf9;vertical-align:middle}td:first-child{border-radius:10px 0 0 10px;font-weight:700}td:last-child{border-radius:0 10px 10px 0}.answer{display:flex;gap:6px}.result{margin-top:16px;padding:16px;border-radius:14px;background:#edf7f1}.result strong{font-size:24px}@media(max-width:560px){table,tbody,tr,td{display:block;width:100%}thead{display:none}td{border-radius:0!important;margin:4px 0;padding:10px}.answer{margin-top:8px}}
.cls-icon{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cls-entry .cls-icon{width:38px;height:38px;color:#145c4c}.cls-entry-blood .cls-icon{color:#a62b2b}.cls-entry-heart .cls-icon{color:#b5484a}.cls-entry-case .cls-icon{color:#2d6a9f}
.cls-spec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cls-spec-card{display:grid;gap:6px;justify-items:start;align-content:start;text-align:left;min-height:118px;padding:14px;border:1px solid #b9c9c3;border-radius:14px;background:#f7faf9;color:#102a24;cursor:pointer;font:inherit;min-width:0}
.cls-spec-card:hover,.cls-spec-card:focus-visible{border-color:#145c4c;outline:2px solid #145c4c33}
.cls-spec-card .cls-icon{width:30px;height:30px;color:#145c4c}
.cls-spec-card strong{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.cls-spec-card .cls-muted{font-size:13px}
.cls-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.cls-pager button{min-height:44px;padding:8px 14px;border-radius:11px;border:1px solid #145c4c;background:#fff;color:#145c4c;font:inherit;font-weight:700;cursor:pointer}
.cls-pager button:disabled{opacity:.4;cursor:default;border-color:#b9c9c3;color:#60736c}
.cls-pager span{color:#60736c;font-weight:700;font-size:14px}
.cls-case-card .cls-icon{display:none}
@media(max-width:380px){.cls-spec-grid{grid-template-columns:1fr}}
.cls-case-card{position:relative}.cls-case-card>div:first-child{padding-right:30px}
.cls-ai-chip{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;border-radius:999px;background:#fff2cf;color:#704b00;border:1px solid #d9b75e;font-size:11px;font-weight:800;vertical-align:middle;margin-left:6px}
.cls-ai-chip--corner{position:absolute;top:8px;right:8px;margin:0}
.cls-info{margin-top:18px;padding:12px 14px;border:1px solid #d7e0dc;border-radius:12px;background:#f7faf9;color:#102a24;font-size:14px;line-height:1.55}
.cls-info summary{cursor:pointer;font-weight:700;color:#145c4c}
.cls-info p{margin:8px 0 0}
